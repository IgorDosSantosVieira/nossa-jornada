<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nossa jornada do amor</title>
<style>
:root{color-scheme:light;--bg1:#f6e3e6;--bg2:#d49aa8;--ink:#4a0a1e;--hot:#7b1230;--card:#fffafa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Quicksand","Trebuchet MS",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;text-align:center}
main{max-width:520px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:"Pacifico","Brush Script MT",cursive;font-weight:400;font-size:2.2rem;margin:10px 0 4px;color:var(--hot)}
h2{font-size:1.3rem;margin:44px 0 16px;color:var(--hot)}
.sub{margin:0 0 18px;opacity:.85}
.heart{font-size:2.4rem;animation:b 1.4s infinite}
@keyframes b{50%{transform:scale(1.18)}}
.photo{position:relative;background:#ffe3ef center/cover;border:3px dashed #f58ab8;display:flex;align-items:center;justify-content:center;font-size:.85rem;cursor:pointer;overflow:hidden;color:var(--hot)}
.photo.has{border:3px solid #fff}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.round{width:200px;height:200px;border-radius:50%;margin:18px auto;box-shadow:0 8px 24px #c2185b40}
.box{background:var(--card);border-radius:16px;box-shadow:0 6px 0 #f3a9c9,0 10px 20px #c2185b30;padding:16px 8px;margin:16px 0;display:flex;justify-content:space-around}
.box div b{display:block;font-size:2.2rem;line-height:1}
.box div span{font-size:.8rem}
.card{background:var(--card);border-radius:18px;box-shadow:0 8px 20px #c2185b30;margin:18px 0;overflow:hidden;text-align:left}
.card .photo{height:220px;border-radius:0;border-width:0 0 3px;border-style:dashed}
.card .photo.has{border:0}
.card div.t{padding:14px 18px 18px}
.card small{color:var(--hot);font-weight:700;letter-spacing:.04em}
.card h3{margin:2px 0 6px;font-size:1.15rem}
.card p{margin:0;line-height:1.5}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal .photo{height:140px;border-radius:14px}
.letter{background:var(--card);border-radius:18px;padding:24px 22px;text-align:left;line-height:1.75;box-shadow:0 8px 20px #c2185b30;font-size:1.02rem}
.letter p{margin:0 0 12px}
.sign{text-align:right;color:var(--hot);font-weight:700}
footer{margin-top:36px;font-size:.85rem;opacity:.8}
.photo{background-color:#f3dde1;border-color:#a8445d}.box{box-shadow:0 6px 0 #c98a98,0 10px 20px #5a0a2240}.card,.letter{box-shadow:0 8px 20px #5a0a2240}.round{box-shadow:0 8px 24px #5a0a2255}
.photo.has{background-position:center 30%}
.card .photo{height:320px}
.gal figure{margin:0;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 6px 16px #5a0a2240}
.gal figure.wide{grid-column:1/-1}
.gal .photo{height:230px;border:0;border-radius:0}
.gal figure.wide .photo{height:360px}
figcaption{padding:10px 8px;font-weight:700;font-size:.9rem}
</style>
</head>
<body>
<main>
  <div class="heart">❤️</div>
  <h1 id="title"></h1>
  <p class="sub">Quanto tempo de amor já vivemos?</p>

  <div class="photo round has" id="cover"></div>

  <div class="box" id="c1"></div>
  <div class="box" id="c2"></div>
  <p>❤️ tempo que os nossos corações batem juntos ❤️</p>

  <h2>Nossos momentos</h2>
  <div id="moments"></div>

  <h2>Momentos de alegria</h2>
  <div class="gal" id="gal"></div>

  <h2>Uma carta pra você</h2>
  <div class="letter" id="letter"></div>

  <footer id="foot"></footer>
</main>

function ph(k,pos){return '<div class="photo has" style="background-image:url('+IMG[k]+');background-position:'+(pos||'center 30%')+'"></div>'}
document.getElementById("cover").style.backgroundImage = "url("+IMG.capa+")";
document.getElementById("moments").innerHTML = CFG.momentos.map(function(m){
  return '<div class="card">'+(m.k?ph(m.k):"")+'<div class="t"><small>'+m.d+'</small><h3>'+m.t+'</h3><p>'+m.x+'</p></div></div>';
}).join("");
document.getElementById("gal").innerHTML = CFG.galeria.map(function(g,i){
  var w = (i==CFG.galeria.length-1 && CFG.galeria.length%2) ? "wide" : "";
  return '<figure class="'+w+'">'+ph(g.k,g.p)+'<figcaption>'+g.t+'</figcaption></figure>';
}).join("");


function setPhoto(el, url){
  el.style.backgroundImage = "url("+url+")";
  el.classList.add("has");
  var s = el.querySelector("span"); if (s) s.style.display = "none";
}
document.querySelectorAll("label.photo").forEach(function(el){
  var k = el.getAttribute("data-k");
  try { var saved = localStorage.getItem("foto_"+k); if (saved) setPhoto(el, saved); } catch(e){}
  el.querySelector("input").addEventListener("change", function(ev){
    var f = ev.target.files[0]; if (!f) return;
    var img = new Image();
    img.onload = function(){
      var max = 700, r = Math.min(1, max/Math.max(img.width,img.height));
      var c = document.createElement("canvas");
      c.width = img.width*r; c.height = img.height*r;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      var url = c.toDataURL("image/jpeg",.8);
      setPhoto(el, url);
      try { localStorage.setItem("foto_"+k, url); } catch(e){}
    };
    img.src = URL.createObjectURL(f);
  });
});

function box(items){
  return items.map(function(i){return "<div><b>"+i[0]+"</b><span>"+i[1]+"</span></div>"}).join("");
}
function pad(n){return n<10?"0"+n:""+n}
function tick(){
  var a = new Date(CFG.inicio), b = new Date();
  if (b < a) b = a;
  var y = b.getFullYear()-a.getFullYear(), m = b.getMonth()-a.getMonth();
  var d = b.getDate()-a.getDate(), h = b.getHours()-a.getHours();
  var mi = b.getMinutes()-a.getMinutes(), s = b.getSeconds()-a.getSeconds();
  if (s<0){s+=60;mi--}
  if (mi<0){mi+=60;h--}
  if (h<0){h+=24;d--}
  if (d<0){d+=new Date(b.getFullYear(), b.getMonth(), 0).getDate();m--}
  if (m<0){m+=12;y--}
  document.getElementById("c1").innerHTML = box([[y,"Anos"],[m,"Meses"],[d,"Dias"]]);
  document.getElementById("c2").innerHTML = box([[pad(h),"Horas"],[pad(mi),"Minutos"],[pad(s),"Segundos"]]);
}
tick(); setInterval(tick, 1000);
</script>
